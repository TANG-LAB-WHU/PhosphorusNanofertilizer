[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanop-lca-tea"
version = "0.1.0"
description = "LCA-TEA Framework for Nano Hydroxyapatite Phosphorus Fertilizer"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "SIQI TANG"}
]
keywords = ["lca", "tea", "nano-fertilizer", "hydroxyapatite", "phosphorus", "life-cycle-assessment"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic:: LCA-TEA",
    "Topic:: Functional Nanomaterials"
]

dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "networkx>=3.2.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "lca_algebraic>=0.9.0",
    "numpy-financial>=1.0.0",
    "SALib>=1.4.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "google-genai>=1.0.0",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "lightrag-hku>=1.0.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "xgboost>=2.0.0",
    "beautifulsoup4>=4.12.0",
]
pdf = [
    "PyMuPDF>=1.23.0",
    "mineru[all]",
]
kg = [
    "neo4j>=5.0.0",
]
viz = [
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "matplotlib>=3.8.0",
    "pyvis>=0.3.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=25.1.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/TANG-LAB-WHU/PhosphorusNanofertilizer"
Repository = "https://github.com/TANG-LAB-WHU/PhosphorusNanofertilizer.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]
