name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade pip
          # Install only core dependencies (not AI/ML packages to save space)
          pip install pandas numpy openpyxl networkx scikit-learn pyyaml numpy-financial SALib python-dotenv requests tqdm
          pip install pytest pytest-cov
          pip install -e .

      - name: Run core tests
        run: |
          # Run tests excluding AI/Gemini tests (requires API key)
          pytest tests/ -v --ignore=tests/test_gemini_api.py

      - name: Test imports
        run: |
          python -c "from nanop import LCAEngine, TEAEngine, get_pathway; print('Import test passed')"

      - name: Check code style (optional)
        run: |
          pip install ruff
          ruff check nanop --select=E9,F63,F7,F82 || true
